<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#12302D">
  <title>Dashboard | ScholarTrack</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="app.css">
</head>
<body data-page="dashboard" data-access="staff">
<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>

  <main class="main">
    <header class="page-head">
      <div class="title-wrap">
        <button type="button" class="menu-btn" aria-controls="sidebar" aria-expanded="false" aria-label="Open menu"><span data-icon="menu"></span></button>
        <div>
          <h1 id="greeting">Welcome back</h1>
          <p class="muted">Admin Dashboard</p>
        </div>
      </div>
      <a class="btn" id="new-sch-btn" href="scholarships.html"><span data-icon="plus"></span>New scholarship</a>
    </header>

    <section class="kpis" aria-label="Summary">
      <div class="kpi"><span class="kpi-ic" data-icon="users"></span><div><b id="k-total">0</b><span>Total applicants</span></div></div>
      <div class="kpi"><span class="kpi-ic" data-icon="clock"></span><div><b id="k-review">0</b><span>Under review</span></div></div>
      <div class="kpi"><span class="kpi-ic" data-icon="calendar"></span><div><b id="k-interview">0</b><span>Interviews</span></div></div>
      <div class="kpi"><span class="kpi-ic" data-icon="award"></span><div><b id="k-awarded">0</b><span>Awarded</span></div></div>
    </section>

    <div class="grid-2">
      <section class="card flush">
        <div class="card-head"><h2>Recent applicants</h2><a href="applicants.html">View all</a></div>
        <div class="table-wrap">
          <table>
            <thead><tr><th scope="col">Applicant</th><th scope="col">Scholarship</th><th scope="col">Status</th><th scope="col">Score</th></tr></thead>
            <tbody id="recent-body"></tbody>
          </table>
        </div>
        <div id="recent-empty" hidden></div>
      </section>

      <div class="stack">
        <section class="card">
          <h2>Applications by status</h2>
          <div id="status-chart"></div>
        </section>
        <section class="card">
          <h2>Open scholarships</h2>
          <ul class="list" id="open-list"></ul>
          <div id="open-empty" hidden></div>
        </section>
      </div>
    </div>
  </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
