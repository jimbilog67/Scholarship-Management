<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#12302D">
  <title>Scholarships | ScholarTrack</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="app.css">
</head>
<body data-page="scholarships" data-access="staff">
<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>

  <main class="main">
    <header class="page-head">
      <div class="title-wrap">
        <button type="button" class="menu-btn" aria-controls="sidebar" aria-expanded="false" aria-label="Open menu"><span data-icon="menu"></span></button>
        <div>
          <h1>Scholarships</h1>
          <p class="muted">Create scholarships and decide who can apply.</p>
        </div>
      </div>
    </header>

    <div class="grid-2" id="sch-layout">
      <div>
        <ul class="sch-grid" id="sch-list"></ul>
        <div class="card" id="sch-empty" hidden></div>
      </div>

      <section class="card" id="new-scholarship">
        <h2>New scholarship</h2>
        <form id="scholarship-form">
          <div class="fields">
            <div class="field full">
              <label for="s-name">Scholarship name</label>
              <input type="text" id="s-name" required>
            </div>
            <div class="field">
              <label for="s-amount">Award amount</label>
              <input type="number" id="s-amount" min="0" step="1" required>
            </div>
            <div class="field">
              <label for="s-slots">Number of awards</label>
              <input type="number" id="s-slots" min="1" required>
            </div>
            <div class="field">
              <label for="s-deadline">Deadline</label>
              <input type="date" id="s-deadline" required>
            </div>
            <div class="field">
              <label for="s-gpa">Minimum GPA</label>
              <input type="number" id="s-gpa" min="0" max="4" step="0.1" value="3.0" required>
            </div>
            <div class="field full">
              <label for="s-desc">Description and requirements</label>
              <textarea id="s-desc" required></textarea>
            </div>
          </div>
          <div class="actions" style="margin-top:20px">
            <button type="submit" class="btn">Save scholarship</button>
            <button type="reset" class="btn btn-outline">Clear form</button>
          </div>
        </form>
      </section>
    </div>
  </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
